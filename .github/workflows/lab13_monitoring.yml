name: Lab 13 - End-to-End MLOps

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
      timezone: "Asia/Kolkata"

jobs:
  mlops-monitoring:
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Run MLOps monitoring trigger
        working-directory: /Users/bhavyasreekotha/Downloads/churn-prediction-rerun/churn-prediction
        run: .venv/bin/python src/mlops_pipeline/12_monitor_trigger.py

      - name: Show monitoring result
        working-directory: /Users/bhavyasreekotha/Downloads/churn-prediction-rerun/churn-prediction
        run: |
          if [ -f outputs/monitoring/monitor_trigger_report.json ]; then
            cat outputs/monitoring/monitor_trigger_report.json
          else
            echo "Monitoring report was not generated."
          fi

      - name: Verify Kubernetes
        run: |
          kubectl get deployment churn-api
          kubectl get pods